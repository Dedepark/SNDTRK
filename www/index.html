<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080808">
  <title>SNDTRK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ═══ VIEW: PLAYER ═══ -->
  <section class="view active" id="view-player">
    <div class="ambient-bg" id="ambient-bg">
      <img id="ambient-img" alt="">
    </div>
    <div class="ambient-overlay"></div>

    <div class="player-stage">
      <!-- Art Block -->
      <div class="art-block">
        <div class="art-card" id="art-wrap">
          <img id="album-art" alt="">
          <div class="art-ph" id="art-ph">
            <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
              <circle cx="28" cy="28" r="24" stroke="#222" stroke-width="1.5"/>
              <circle cx="28" cy="28" r="10" stroke="#222" stroke-width="1.5"/>
              <circle cx="28" cy="28" r="3" fill="#1a1a1a"/>
              <line x1="28" y1="4"  x2="28" y2="18" stroke="#1e1e1e" stroke-width="1.2"/>
              <line x1="28" y1="38" x2="28" y2="52" stroke="#1e1e1e" stroke-width="1.2"/>
              <line x1="4"  y1="28" x2="18" y2="28" stroke="#1e1e1e" stroke-width="1.2"/>
              <line x1="38" y1="28" x2="52" y2="28" stroke="#1e1e1e" stroke-width="1.2"/>
            </svg>
          </div>
          <canvas id="vis-canvas"></canvas>
        </div>
      </div>

      <!-- Meta -->
      <div class="meta-block">
        <h1 class="song-title" id="p-title">No Track Selected</h1>
        <p class="song-artist" id="p-artist">— — —</p>
      </div>

      <!-- Progress -->
      <div class="progress-block">
        <div class="prog-bar" id="prog-bar">
          <div class="prog-rail">
            <div class="prog-fill" id="prog-fill" style="width:0%"></div>
          </div>
        </div>
        <div class="time-row">
          <span id="t-cur">0:00</span>
          <span id="t-tot">0:00</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-block">
        <button class="ctrl-aux" id="btn-shuf" title="Shuffle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
          </svg>
        </button>
        <button class="ctrl-skip" id="btn-prev" title="Prev">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="19 20 9 12 19 4 19 20"/>
            <rect x="5" y="4" width="2.5" height="16" rx="1"/>
          </svg>
        </button>
        <button class="ctrl-play" id="btn-play" title="Play / Pause">
          <svg id="ic-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg id="ic-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <rect x="6" y="4" width="4" height="16" rx="1.5"/>
            <rect x="14" y="4" width="4" height="16" rx="1.5"/>
          </svg>
        </button>
        <button class="ctrl-skip" id="btn-next" title="Next">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 4 15 12 5 20 5 4"/>
            <rect x="16.5" y="4" width="2.5" height="16" rx="1"/>
          </svg>
        </button>
        <button class="ctrl-aux" id="btn-rep" title="Repeat">
          <span class="rep-one-badge">1</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ═══ VIEW: LIBRARY ═══ -->
  <section class="view" id="view-lib">
    <div class="mini-player" id="mini-player">
      <div class="mini-art" id="mini-art">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="7" x2="12" y2="2"/>
          <line x1="12" y1="22" x2="12" y2="17"/><line x1="7" y1="12" x2="2" y2="12"/>
          <line x1="22" y1="12" x2="17" y2="12"/>
        </svg>
      </div>
      <div class="mini-info">
        <div class="mini-title" id="mini-title">No track</div>
        <div class="mini-artist" id="mini-artist">—</div>
      </div>
      <div class="mini-progress-bar" id="mini-prog">
        <div class="mini-progress-fill" id="mini-fill" style="width:0%"></div>
      </div>
      <button class="mini-btn" id="mini-play">
        <svg id="mini-ic-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="mini-ic-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>
        </svg>
      </button>
      <button class="mini-btn" id="mini-next">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 4 15 12 5 20 5 4"/>
          <rect x="16.5" y="4" width="2.5" height="16" rx="1"/>
        </svg>
      </button>
    </div>

    <div class="lib-header">
      <div class="lib-title-wrap">
        <span class="lib-wordmark">LIBRARY</span>
        <span class="lib-count" id="lib-count">0 tracks</span>
      </div>
      <button class="btn-add" id="btn-add">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        ADD
      </button>
    </div>

    <div id="song-list"></div>
    <div class="empty-state" id="empty" style="display:none">
      <div class="empty-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="empty-h">Library is Empty</div>
      <div class="empty-s">Tap ADD to import your music.<br>Files stay in your browser — fully offline.</div>
    </div>
  </section>

  <!-- ═══ VIEW: EQ ═══ -->
  <section class="view" id="view-eq">
    <div class="eq-header">
      <div class="eq-wordmark">EQUALIZER</div>
      <div class="eq-sub">Web Audio API · Real-time DSP</div>
    </div>

    <div class="eq-body">
      <div class="eq-card">
        <div class="eq-card-label">BASS</div>
        <div class="eq-card-freq">200 Hz · Low Shelf</div>
        <div class="eq-card-value"><em id="vb">0</em><span>dB</span></div>
        <input type="range" id="eq-b" min="-10" max="10" value="0" step="0.5">
        <div class="eq-bar-track">
          <div class="eq-bar-fill" id="eq-b-fill" style="width:50%"></div>
        </div>
      </div>

      <div class="eq-card">
        <div class="eq-card-label">TREBLE</div>
        <div class="eq-card-freq">3 kHz · High Shelf</div>
        <div class="eq-card-value"><em id="vt">0</em><span>dB</span></div>
        <input type="range" id="eq-t" min="-10" max="10" value="0" step="0.5">
        <div class="eq-bar-track">
          <div class="eq-bar-fill" id="eq-t-fill" style="width:50%"></div>
        </div>
      </div>

      <div class="eq-card vol-card">
        <div class="eq-card-label">VOLUME</div>
        <div class="eq-card-freq">Output Gain</div>
        <div class="eq-card-value"><em id="vol-val">100</em><span>%</span></div>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
        <div class="eq-bar-track">
          <div class="eq-bar-fill vol-fill" id="vol-fill" style="width:100%"></div>
        </div>
      </div>
    </div>

    <div class="eq-reset-row">
      <button class="eq-reset-btn" id="btn-eq-reset">RESET ALL</button>
    </div>
  </section>

  <!-- ═══ VIEW: SETTINGS ═══ -->
  <section class="view" id="view-settings">
    <!-- Populated by settings.js -->
  </section>

  <!-- ═══ BOTTOM NAV ═══ -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn active" data-target="view-player" id="nav-player">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/>
      </svg>
      <span>Player</span>
    </button>
    <button class="nav-btn" data-target="view-lib" id="nav-lib">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
      <span>Library</span>
    </button>
    <button class="nav-btn" data-target="view-eq" id="nav-eq">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
        <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/>
        <line x1="17" y1="16" x2="23" y2="16"/>
      </svg>
      <span>EQ</span>
    </button>
    <button class="nav-btn" data-target="view-settings" id="nav-settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Settings</span>
    </button>
  </nav>

</div><!-- #app -->

<input type="file" id="file-input" accept="audio/*" multiple style="display:none">
<div id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
